<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เกาะลอยฟ้า · Chinese Fun</title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
:root{--ink:#6b3a55;--pink:#ff8fb8;--pink2:#ffd3e4;--mint:#b8f0c8;--cream:#fff8e8;--ok:#7fdca0;--no:#ff9aa8;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;font-family:'Mali','ZCOOL KuaiLe','Noto Sans Thai',sans-serif;color:var(--ink);background:#ffe9f3}
#sky{position:fixed;inset:0;background:radial-gradient(circle at 20% 15%,#fff 0,transparent 35%),linear-gradient(180deg,#bfe6ff,#ffe0ee 55%,#fff3d6)}
#view{position:fixed;inset:0;cursor:grab;touch-action:none}
#world{position:absolute;left:0;top:0;width:1400px;height:900px;transform-origin:0 0}
.cloud{position:absolute;font-size:70px;opacity:.85;animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(50px)}}
.ring{position:absolute;left:180px;top:120px;width:1040px;height:660px;border:14px solid rgba(160,220,255,.7);border-radius:50%;box-shadow:inset 0 0 0 6px rgba(255,255,255,.6)}
.island{position:absolute;width:200px;text-align:center;cursor:pointer;animation:bob 4s ease-in-out infinite}
.island:hover{filter:drop-shadow(0 8px 10px rgba(255,120,170,.45))}
@keyframes bob{50%{transform:translateY(-12px)}}
.top{position:relative;height:96px;border-radius:50%;background:radial-gradient(ellipse at 40% 30%,#fff,var(--c) 70%);border:4px solid #fff}
.top span{position:absolute;font-size:46px;left:50%;top:-30px;transform:translateX(-50%)}
.top i{position:absolute;font-style:normal;font-size:22px}
.under{width:150px;height:70px;margin:-18px auto 0;background:linear-gradient(#e9b48a,#c98f9f);clip-path:polygon(0 0,100% 0,50% 100%)}
.label{position:absolute;left:50%;top:104px;transform:translateX(-50%);background:#fffffff0;border:3px solid var(--pink2);border-radius:18px;padding:4px 14px;white-space:nowrap;font-size:15px;box-shadow:0 4px 10px rgba(255,140,190,.25)}
.label small{display:block;color:#c06a93;font-size:12px}
.badge{position:absolute;right:4px;top:-8px;background:var(--pink);color:#fff;border-radius:99px;font-size:12px;padding:1px 8px;display:none}
#hero{position:absolute;font-size:46px;transition:left 1s cubic-bezier(.5,0,.2,1),top 1s cubic-bezier(.5,0,.2,1);pointer-events:none;z-index:5;animation:hop .6s ease-in-out infinite alternate}
@keyframes hop{to{margin-top:-8px}}
.sp{position:absolute;pointer-events:none;animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.2;transform:scale(.6)}}
#hud{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));background:#fffffff0;border-radius:20px;padding:10px 16px;box-shadow:0 6px 18px rgba(255,140,190,.3);font-size:14px;z-index:10}
#hud b{color:#e0529a}
.bar{height:10px;border-radius:9px;background:var(--pink2);margin-top:6px;overflow:hidden;width:170px}
.bar div{height:100%;width:0;background:repeating-linear-gradient(45deg,var(--pink),var(--pink) 8px,#ffb3d1 8px,#ffb3d1 16px);transition:width .5s}
#dock{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:4px;background:#fffffff0;padding:6px;border-radius:30px;box-shadow:0 8px 24px rgba(255,140,190,.35);z-index:10}
button{font:inherit;color:var(--ink);cursor:pointer}
#dock button{background:none;border:0;border-radius:24px;padding:9px 14px;font-size:14px}
#dock button:hover,#dock button.on{background:var(--pink2)}
#panel{position:fixed;left:50%;bottom:0;width:min(480px,100%);max-height:82vh;overflow:auto;transform:translate(-50%,110%);transition:transform .35s;background:var(--cream);border:4px solid #fff;border-radius:28px 28px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(255,120,170,.3);z-index:20}
#panel.open{transform:translate(-50%,0)}
#panel h2{margin:0 0 8px;font-weight:500;font-size:21px}
#x{position:absolute;right:14px;top:10px;border:0;background:none;font-size:22px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;border:3px solid #fff;background:var(--pink2);border-radius:16px;padding:7px}
.tabs button.on{background:var(--pink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{height:92px;perspective:600px;cursor:pointer}
.card div{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.card.flip div{transform:rotateY(180deg)}
.card b,.card em{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:16px;backface-visibility:hidden;font-style:normal;border:3px solid #fff;padding:2px;text-align:center}
.card b{background:var(--pink2);font-size:24px;font-weight:500}
.card b small{font-size:11px;color:#b0507f;font-weight:400}
.card em{background:var(--mint);transform:rotateY(180deg);font-size:14px}
.q{text-align:center}
.q .big{font-size:42px;margin:6px 0}
.q .big small{display:block;font-size:15px;color:#b0507f}
.opt{display:block;width:100%;margin:7px 0;padding:11px;border:3px solid #fff;background:var(--pink2);border-radius:16px;font-size:17px}
.opt.ok{background:var(--ok)}.opt.no{background:var(--no)}
.sm{font-size:13px;color:#b0507f;margin-bottom:4px}
.go{margin-top:10px;width:100%;border:0;background:var(--pink);color:#fff;font-size:16px;padding:12px;border-radius:20px;box-shadow:0 5px 0 #e0629a}
.opt.sel{background:#ffb3d1;border-color:#ff8fb8}.mt{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mb{margin:0 0 8px;font-size:18px;padding:9px 4px}.mb small{display:block;font-size:12px;color:#b0507f}.opt.ok{background:var(--ok)}.opt.no{background:var(--no)}.card em small{display:block}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}#tags{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}.tag{position:absolute;transform:translate(-50%,0);background:#fffffff0;border:3px solid var(--pink2);border-radius:16px;padding:3px 12px;font-size:14px;white-space:nowrap;pointer-events:auto;cursor:pointer;box-shadow:0 4px 10px rgba(255,140,190,.25)}.tag small{display:block;color:#c06a93;font-size:11px}.tag .badge{right:-8px;top:-10px}
.lw{background:#fff;border-radius:18px;padding:8px 10px;margin-bottom:8px;border:3px solid var(--pink2)}.lt{display:flex;align-items:center;gap:10px;cursor:pointer}.lt b{flex:0 0 auto;font-size:26px;font-weight:500;min-width:84px}.lt span{flex:1;font-size:12px;color:#b0507f;line-height:1.35}.lt strong{font-size:15px;color:var(--ink);font-weight:500}.ls{margin-top:6px;padding:6px 10px;background:var(--cream);border-radius:12px;cursor:pointer;font-size:17px}.ls small{display:block;font-size:12px;color:#b0507f}
.hit{position:absolute;border:0;background:transparent;cursor:pointer;border-radius:28%;padding:0}.hit:hover{background:rgba(255,255,255,.3)}
#land{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#d3e6ff,#f3d8ff)}
#stage{position:relative;width:min(100vw,calc(100vh*1.0943));aspect-ratio:1300/1188}#bg{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
#go{border-radius:40%;animation:pl 1.8s infinite}#go:hover{transform:scale(1.06);background:rgba(255,255,255,.25)}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(255,255,255,.9)}100%{box-shadow:0 0 0 22px rgba(255,255,255,0)}}
.mdl{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(120,70,140,.35);z-index:5}
.mc{background:var(--cream);border:5px solid #fff;border-radius:28px;padding:22px;width:min(380px,90vw);text-align:center;box-shadow:0 12px 40px rgba(150,80,170,.35)}
.mc h3{margin:0 0 6px;font-weight:500;font-size:22px}.mc p{margin:4px 0 12px;font-size:14px}
#nin{width:100%;font:inherit;font-size:20px;text-align:center;padding:12px;border:3px solid var(--pink2);border-radius:18px;color:var(--ink);outline:none}#nin:focus{border-color:var(--pink)}#nin.err{border-color:#ff6b8a;animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.mc .x2{margin-top:8px;border:0;background:none;font-size:13px;text-decoration:underline;color:#c06a93}
</style></head><body>
